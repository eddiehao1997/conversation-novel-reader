<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TXT 小说阅读器</title>
<meta name="description" content="离线可用的 TXT 小说阅读器，Google Drive 同步阅读进度">
<meta name="theme-color" content="#eeeae1" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小说阅读">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: one centred reading column, sticky top bar that hides while reading, sheet panels for TOC/settings */
:root{
  --bg:#f7f5f0;--fg:#2a2824;--muted:#857f73;--panel:#eeeae1;--line:#ddd7ca;--accent:#8c5d2a;--on-accent:#fff;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs:20px;--w:40em;--lh:1.9;
}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a1c;--fg:#c8c4bb;--muted:#7a766e;--panel:#232326;--line:#333336;--accent:#d2a468;--on-accent:#1a1a1c;color-scheme:dark}}
/* reader-chosen paper colours override the system theme */
body.t-light{--bg:#f7f5f0;--fg:#2a2824;--muted:#857f73;--panel:#eeeae1;--line:#ddd7ca;--accent:#8c5d2a;--on-accent:#fff;color-scheme:light}
body.t-sepia{--bg:#f2e8d2;--fg:#3b2f1e;--muted:#8c7a5b;--panel:#e8dbbd;--line:#d8c8a4;--accent:#8a5a1f;--on-accent:#fff;color-scheme:light}
body.t-green{--bg:#cfe6d0;--fg:#1f2d20;--muted:#557258;--panel:#bed9c1;--line:#a6c9ab;--accent:#2f6b3a;--on-accent:#fff;color-scheme:light}
body.t-dark{--bg:#1a1a1c;--fg:#c8c4bb;--muted:#7a766e;--panel:#232326;--line:#333336;--accent:#d2a468;--on-accent:#1a1a1c;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;-webkit-text-size-adjust:100%}
html{overscroll-behavior-y:none}
button,label,a{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--serif);transition:background .2s,color .2s;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);font-family:var(--ui);font-size:14px;transition:transform .25s}
.bar.hide{transform:translateY(-100%)}
.bar .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.35;cursor:default}

#toc{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column;font-family:var(--ui);font-size:15px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#toc.open{transform:none}
#toc header{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
#tocSearch{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#tocList{overflow:auto;flex:1;padding:4px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tocList a{display:block;padding:9px 16px;color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tocList a{display:flex;justify-content:space-between;gap:10px}
#tocList a span{min-width:0;overflow:hidden;text-overflow:ellipsis}
#tocList a small{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
#tocList a.vol{font-weight:600;color:var(--accent);padding-top:14px}
#tocList a.cur,#tocList a:hover{background:var(--line)}
#shade{position:fixed;inset:0;background:#0006;z-index:15}

#settings{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top,0px));z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;width:280px;font-family:var(--ui);font-size:14px;box-shadow:0 8px 24px #0003}
#settings .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
#settings input[type=range]{flex:1;max-width:150px;accent-color:var(--accent)}
#settings select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.swatches{display:flex;gap:10px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swatch.auto{background:linear-gradient(135deg,#f7f5f0 50%,#1a1a1c 50%)}
@media (max-width:600px){
  #settings{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:14px 14px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px))}
}

main{max-width:var(--w);margin:0 auto;padding:24px max(20px,env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));font-size:var(--fs);line-height:var(--lh)}
main h2{font-size:1.3em;margin:.6em 0 1.2em;text-align:center;font-weight:600;text-wrap:balance}
main p{margin:0 0 .8em;text-indent:2em;text-align:justify;overflow-wrap:anywhere}
main p.empty{text-align:center;text-indent:0;color:var(--muted)}
.nav{display:flex;gap:12px;margin-top:40px;font-family:var(--ui);font-size:15px}
.nav .btn{flex:1;padding:14px}
.hint{text-align:center;color:var(--muted);font-family:var(--ui);font-size:12px;margin-top:14px}

#drop{max-width:560px;margin:10vh auto;padding:36px 22px;text-align:center;border:2px dashed var(--line);border-radius:14px;font-family:var(--ui)}
#drop.over{border-color:var(--accent)}
#drop h1{font-family:var(--serif);font-size:24px;margin:0 0 10px;font-weight:600}
#drop p{color:var(--muted);margin:6px 0 22px;line-height:1.7;font-size:14px;text-indent:0}
#drop label{display:inline-block;background:var(--accent);color:var(--on-accent);padding:12px 24px;border-radius:8px;cursor:pointer;font-size:15px}
#resume{margin-top:16px}
.pct{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;white-space:nowrap}
.sync{background:transparent;cursor:pointer;font-family:var(--ui);font-size:12px;white-space:nowrap;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sync[data-s=ok]{color:var(--accent);border-color:var(--accent)}
.sync[data-s=err],.sync[data-s=renew]{color:#b4462f;border-color:#b4462f}
.sync[data-s=signedout]{color:var(--fg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:min(520px,calc(100vw - 32px));display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px #0003;font-family:var(--ui);font-size:14px;line-height:1.5}
#toastMsg{flex:1;min-width:0}
#toast .act{background:var(--accent);color:var(--on-accent);border-color:var(--accent);white-space:nowrap}
@media (max-width:420px){.sync[data-s=ok],.sync[data-s=saving]{display:none}}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);z-index:6;width:0}
@media (max-width:600px){main{padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- dialogue bubbles ----------
   Each character has a fixed hue (--h) assigned from the book itself; lightness/chroma
   tokens below adapt it to the paper colour so bubbles read well in every theme. */
:root{--av-l:.60;--av-c:.13;--nm-l:.44;--bub-mix:11%;--bub-line:30%}
@media (prefers-color-scheme: dark){:root{--av-l:.64;--av-c:.11;--nm-l:.80;--bub-mix:17%;--bub-line:38%}}
body.t-light,body.t-sepia,body.t-green{--av-l:.60;--av-c:.13;--nm-l:.44;--bub-mix:11%;--bub-line:30%}
body.t-dark{--av-l:.64;--av-c:.11;--nm-l:.80;--bub-mix:17%;--bub-line:38%}
.dl-row{display:flex;gap:10px;align-items:flex-start;margin:0 0 .85em}
.dl-row+.dl-row{margin-top:-.25em}
.av{flex:none;width:34px;height:34px;margin-top:2px;display:grid;place-items:center;border:0;padding:0;cursor:pointer;
  border-radius:50%;background:oklch(var(--av-l) var(--av-c) var(--h));color:#fff;font:600 15px/1 var(--serif);position:relative;
  text-shadow:0 1px 1px #0003}
.av.p1{border-radius:10px}
.av.p2{box-shadow:inset 0 0 0 2px #fff8,inset 0 0 0 4px oklch(var(--av-l) var(--av-c) var(--h))}
.av.p3::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
  background:oklch(var(--nm-l) var(--av-c) var(--h));border:2px solid var(--bg)}
.dl-col{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.dl-who{font:12px/1.4 var(--ui);color:oklch(var(--nm-l) .12 var(--h));display:flex;gap:6px;align-items:baseline;background:none;border:0;padding:0;cursor:pointer}
.dl-who .cf{color:var(--muted);font-size:11px}
.dl-bub{background:color-mix(in oklab,oklch(var(--av-l) var(--av-c) var(--h)) var(--bub-mix),var(--bg));
  border:1px solid color-mix(in oklab,oklch(var(--av-l) var(--av-c) var(--h)) var(--bub-line),var(--bg));
  border-radius:4px 14px 14px 14px;padding:.4em .8em;max-width:100%;text-align:left;overflow-wrap:anywhere}
.dl-row.inf .dl-bub{border-style:dashed}
/* inner monologue: rounder, lighter, dotted outline, so thought never reads as speech */
.dl-row .dl-bub.th{border-radius:16px;border-style:dotted;border-width:2px;background:color-mix(in oklab,oklch(var(--av-l) var(--av-c) var(--h)) 5%,var(--bg));color:color-mix(in oklab,var(--fg) 82%,var(--bg))}
.dl-row.unk .dl-bub.th{background:transparent}
.dl-bub.th::before{content:"心想 · ";font:11px/1 var(--ui);color:var(--muted);letter-spacing:.05em}
.dl-tag{font-size:.84em;color:var(--muted);line-height:1.6;padding:0 .2em}
.dl-row.unk .av{background:var(--line);color:var(--muted);text-shadow:none}
.dl-row.unk .dl-who{color:var(--muted)}
.dl-row.unk .dl-bub{background:var(--panel);border-color:var(--line)}
.dlg.para{margin:0 0 .8em}
/* switch */
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px #0003;transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
#settings .note{font-size:12px;color:var(--muted);margin:-4px 0 8px}
/* sheet: speaker picker + cast manager */
#sheet{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 48px));
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0004;font-family:var(--ui);font-size:14px}
#sheet header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#sheet h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#sheet .quote{color:var(--muted);font-family:var(--serif);font-size:13px;line-height:1.5;max-height:3em;overflow:hidden}
#sheet .scope{display:flex;gap:6px;flex-wrap:wrap}
#sheet .scope label{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px}
#sheet .scope input{accent-color:var(--accent);margin:0}
#sheetSearch{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#sheetList{overflow:auto;flex:1;padding:6px 0;overscroll-behavior:contain}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:7px 16px;background:none;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.pick:hover,.pick:focus-visible{background:var(--line)}
.pick .av{width:30px;height:30px;font-size:13px;pointer-events:none}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick.cur{background:color-mix(in oklab,var(--accent) 14%,transparent)}
.pick.hidden-c .nm{text-decoration:line-through;color:var(--muted)}
.pick .acts{display:flex;gap:6px}
.pick .acts .btn{min-height:28px;padding:3px 8px;font-size:12px}
#sheet footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:12px}
@media (max-width:600px){#sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:78vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <button class="btn" id="tocBtn" title="目录 (T)">☰ 目录</button>
  <div class="title" id="barTitle">TXT 小说阅读器</div>
  <span class="pct" id="pct" hidden></span>
  <button class="sync" id="sync" hidden></button>
  <button class="btn" id="openBtn" title="打开其他文件" aria-label="打开其他文件">📂</button>
  <button class="btn" id="setBtn" title="设置" aria-label="阅读设置">Aa</button>
</div>
<div id="progress"></div>

<nav id="toc" aria-label="目录">
  <header><input id="tocSearch" placeholder="搜索章节…"><button class="btn" id="tocClose" aria-label="关闭目录">✕</button></header>
  <div id="tocList"></div>
</nav>
<div id="shade" hidden></div>

<div id="settings" hidden>
  <div class="row">字号 <span><button class="btn" data-fs="-1">A−</button> <span id="fsVal"></span> <button class="btn" data-fs="1">A+</button></span></div>
  <div class="row"><label for="lh">行距</label><input type="range" id="lh" min="1.4" max="2.6" step="0.1"></div>
  <div class="row"><label for="w">版心宽度</label><input type="range" id="w" min="20" max="60" step="1"></div>
  <div class="row"><label for="font">字体</label><select id="font">
    <option value="serif">宋体 / 衬线</option>
    <option value="sans">黑体 / 无衬线</option>
    <option value="kai">楷体</option>
  </select></div>
  <div class="row"><label for="dlgOn">对话气泡</label><span class="switch"><input type="checkbox" id="dlgOn" role="switch"><span></span></span></div>
  <div class="note" id="dlgNote">用颜色和头像区分说话的角色，点线框为心理活动（实验功能）</div>
  <div class="row" id="castRow" hidden>角色 <button class="btn" id="castBtn">管理角色</button></div>
  <div class="row">主题
    <span class="swatches">
      <button class="swatch auto" data-theme="auto" title="跟随系统"></button>
      <button class="swatch" data-theme="light" style="background:#f7f5f0" title="白"></button>
      <button class="swatch" data-theme="sepia" style="background:#f2e8d2" title="羊皮纸"></button>
      <button class="swatch" data-theme="green" style="background:#cfe6d0" title="护眼绿"></button>
      <button class="swatch" data-theme="dark" style="background:#1a1a1c" title="夜间"></button>
    </span></div>
</div>

<main id="main"></main>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
<div id="toast" role="status" hidden><span id="toastMsg"></span><button class="btn act" id="toastAct" hidden></button><button class="btn" id="toastX" aria-label="关闭">✕</button></div>

<script>
const $=s=>document.querySelector(s);
const isTouch=matchMedia('(pointer:coarse)').matches;
const store={get(k,d){try{const v=localStorage.getItem('nr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('nr_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- IndexedDB: keep the last book so reopening needs no re-pick ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('novelReader',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('books'))d.createObjectStore('books');if(!d.objectStoreNames.contains('cast'))d.createObjectStore('cast')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbGet(st,k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction(st).objectStore(st).get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(st,k,v){try{const db=await idb();db.transaction(st,'readwrite').objectStore(st).put(v,k)}catch(e){}}
async function saveBook(name,buf){try{const db=await idb();db.transaction('books','readwrite').objectStore('books').put({name,buf},'last')}catch(e){}}
async function loadBook(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('books').objectStore('books').get('last');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

/* ---------- settings ---------- */
const FONTS={serif:'var(--serif)',sans:'var(--ui)',kai:'"Kaiti SC","STKaiti","KaiTi","BiauKai",var(--serif)'};
const S=Object.assign({fs:innerWidth<600?19:20,lh:1.9,w:40,theme:'auto',font:'serif',dialogue:false},store.get('settings',{}));
if(!FONTS[S.font])S.font='serif';
function applySettings(){
  const r=document.documentElement.style;
  r.setProperty('--fs',S.fs+'px');r.setProperty('--lh',S.lh);r.setProperty('--w',S.w+'em');
  $('#main').style.fontFamily=FONTS[S.font];
  document.body.className=S.theme==='auto'?'':'t-'+S.theme;
  requestAnimationFrame(()=>{const m=document.getElementById('themeColor');if(m)m.content=getComputedStyle(document.body).getPropertyValue('--panel').trim()||'#eeeae1'});
  document.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',s.dataset.theme===S.theme));
  $('#dlgOn').checked=!!S.dialogue;$('#castRow').hidden=!S.dialogue;
  $('#fsVal').textContent=S.fs;$('#lh').value=S.lh;$('#w').value=S.w;$('#font').value=S.font;
  store.set('settings',S);
}
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{const pos=holdPos();S.fs=Math.max(12,Math.min(40,S.fs+ +b.dataset.fs));applySettings();keepPos(pos)});
$('#lh').oninput=e=>{const pos=holdPos();S.lh=+e.target.value;applySettings();keepPos(pos)};
$('#w').oninput=e=>{const pos=holdPos();S.w=+e.target.value;applySettings();keepPos(pos)};
$('#font').onchange=e=>{S.font=e.target.value;applySettings()};
document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{S.theme=s.dataset.theme;applySettings()});
$('#setBtn').onclick=e=>{e.stopPropagation();$('#settings').hidden=!$('#settings').hidden};
document.addEventListener('click',e=>{if(!$('#settings').contains(e.target)&&e.target!==$('#setBtn'))$('#settings').hidden=true});
applySettings();

/* ---------- parsing ---------- */
function decode(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0xFF&&u8[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);
  if(u8[0]===0xFE&&u8[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){}
  try{return new TextDecoder('gb18030').decode(buf)}catch(e){}
  return new TextDecoder('big5').decode(buf);
}
const NUM='[0-9０-９零〇一二三四五六七八九十百千万两壹贰叁肆伍陆柒捌玖拾佰仟]+';
const VOL_RE=new RegExp(`^(第${NUM}[部卷集篇]|卷${NUM})(\\s.*)?$`);
const CH_RE=new RegExp(`^(第${NUM}[章节回话]|序章|序言|楔子|引子|尾声|后记|番外|终章|完本感言|上架感言)(\\s.*|[:：].*)?$`);
/* Each chapter keeps its non-empty paragraphs plus character offsets,
   so overall progress is weighted by text length, not chapter count. */
function parse(text){
  const lines=text.replace(/\r\n?/g,'\n').split('\n');
  const raw=[];let cur={title:'前言',vol:false,paras:[]};
  for(const line of lines){
    const t=line.trim();
    if(t.length&&t.length<=40&&(VOL_RE.test(t)||CH_RE.test(t))){
      raw.push(cur);cur={title:t,vol:VOL_RE.test(t),paras:[]};
    }else if(t)cur.paras.push(t.replace(/^[\s　]+/,''));
  }
  raw.push(cur);
  const chapters=raw.filter((c,i)=>!(i===0&&!c.paras.length));
  let off=0;
  for(const c of chapters){
    c.start=off;c.paraOff=[];let o=0;
    for(const p of c.paras){c.paraOff.push(o);o+=p.length}
    c.len=o;off+=o;
  }
  return {chapters,total:Math.max(off,1)};
}

/* Book identity: file size + SHA-256 of the first 1 MB. Survives renames,
   so the same book matches across devices. */
async function fingerprint(buf){
  const head=new Uint8Array(buf,0,Math.min(buf.byteLength,1<<20));
  let hex='';
  try{
    const d=new Uint8Array(await crypto.subtle.digest('SHA-256',head));
    hex=[...d.slice(0,12)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ /* non-secure context fallback: FNV-1a */
    let h=0x811c9dc5;for(let i=0;i<head.length;i++){h^=head[i];h=Math.imul(h,16777619)>>>0}
    hex='f'+h.toString(16);
  }
  return 'b_'+buf.byteLength+'_'+hex;
}

/* ---------- reader ---------- */
let book=null,idx=0,paraEls=[];
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtPct(x){return (Math.floor(x*1000)/10).toFixed(1)+'%'}
function pctOf(ch,p){
  const c=book.chapters[ch];
  return Math.min(1,(c.start+(c.paraOff[p]||0))/book.total);
}
/* fixed reading line (bar height + 8px) used for both measuring and restoring, so positions round-trip exactly */
function readLine(){return $('#bar').offsetHeight+8}

/* first paragraph whose bottom is below the reading line */
function curPara(){
  if(!paraEls.length)return 0;
  const line=scrollY+readLine();
  let lo=0,hi=paraEls.length-1,ans=hi;
  while(lo<=hi){const m=(lo+hi)>>1,el=paraEls[m];
    if(el.offsetTop+el.offsetHeight>line){ans=m;hi=m-1}else lo=m+1}
  return ans;
}
function curPos(){return book?{ch:idx,p:curPara()}:null}
function scrollToPara(p){

}

function render(i,p){

    <button class="btn" id="next" ${idx<book.chapters.length-1?'':'disabled'}>下一章 →</button></div>
    <div class="hint">第 ${idx+1} / ${book.chapters.length} 节 · 本章结束时全书 <span id="endPct"></span>${isTouch?' · 左右滑动切换章节':' · ← → 切换章节 · T 打开目录'}</div>`;
  paraEls=c.paras.length?[...document.querySelectorAll('#text > .para')]:[];
  $('#endPct').textContent=fmtPct((c.start+c.len)/book.total);

/* ---------- progress: local record keyed by book fingerprint ---------- */

function updateProgress(){

function saveProgress(urgent){

/* auto-hide top bar, live percentage, debounced save */

/* ---------- Dialogue bubbles ----------
   The cast (names, aliases, colours, avatars) is computed once per book from the text
   in a Web Worker and cached in IndexedDB, so it is identical across chapters, reloads
   and devices. Reader corrections are stored per book on top of it:
     line:  {"ch:p:q": castId | ""}  one line's speaker ("" = not a known character)
     merge: {castId: castId}          treat one entry as another everywhere (aliases)
     hide:  {castId: true}            not a character; its lines show as unknown */
const dlg={data:null,cast:null,busy:false,lib:null};
function dlgReady(){return !!(S.dialogue&&book&&dlg.cast&&dlg.data&&dlg.data.bookId===book.id)}
function loadDialogueLib(){
  if(window.Dialogue)return Promise.resolve(window.Dialogue);
  if(dlg.lib)return dlg.lib;
  return dlg.lib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='dialogue.js';sc.onload=()=>res(window.Dialogue);sc.onerror=()=>{dlg.lib=null;rej(new Error('load'))};document.head.appendChild(sc)});
}
const fixes={
  get(){return book?store.get('dlg_'+book.id,{line:{},merge:{},hide:{}}):{line:{},merge:{},hide:{}}},
  set(v){if(book)store.set('dlg_'+book.id,v)},
};
function castById(id){return dlg.cast&&dlg.cast.byId.get(id)}
/* final speaker after corrections: follows merges, drops hidden entries */
function resolveSpeaker(id,f){
  let seen=0;while(id&&f.merge[id]&&seen++<8)id=f.merge[id];
  if(!id||f.hide[id]||!castById(id))return null;
  return id;
}
async function ensureDialogue(){
  if(!book||dlg.busy)return;
  const D=await loadDialogueLib().catch(()=>null);
  if(!D){toast('对话气泡加载失败，请检查网络后重试');return}
  const key=book.id+':v'+D.VERSION;
  let data=await idbGet('cast',key);
  if(!data){
    dlg.busy=true;const forBook=book.id;
    toast('正在分析这本书里的角色…（仅首次，需要几秒）');
    data=await new Promise(resolve=>{
      const chapters=book.chapters.map(c=>({paras:c.paras}));
      try{
        const w=new Worker('dialogue-worker.js');
        w.onmessage=e=>{w.terminate();resolve(e.data.ok?e.data:null)};
        w.onerror=()=>{w.terminate();resolve(null)};
        w.postMessage({chapters});
      }catch(e){resolve(null)}
    });
    if(!data){                                           /* no worker support: run here */
      try{
        let words;try{words=D.parseWords(await (await fetch('dialogue-words.txt')).text())}catch(e){}
        const chs=book.chapters.map(c=>({paras:c.paras}));const cast=D.buildCast(chs,{words});
        const tails=[];let tail=null;for(const ch of chs){tails.push(tail);tail=D.attributeChapter(ch,cast,tail).tail}
        data={ok:true,list:cast.list,tails};
      }catch(e){data=null}
    }
    dlg.busy=false;
    if(!book||book.id!==forBook)return;
    if(!data){toast('角色分析失败，已保持普通排版');return}
    data={bookId:book.id,list:data.list,tails:data.tails};
    idbPut('cast',key,data);
    hideToast();
  }
  dlg.data=data;
  const byId=new Map(data.list.map(c=>[c.id,c]));
  dlg.cast={list:data.list,byId,matcher:D.makeMatcher(data.list)};
  if(S.dialogue){const pos=curPos();render(pos.ch,pos.p)}
}
/* a line shown as a bubble: spoken dialogue or inner monologue */
function isLine(x){return (x.t==='q'&&x.spoken)||x.t==='th'}
function avHTML(c,extra=''){
  if(!c)return `<span class="av ${extra}" aria-hidden="true">?</span>`;
  return `<span class="av p${c.pattern} ${extra}" style="--h:${c.hue}" aria-hidden="true">${esc(c.glyph)}</span>`;
}
function renderDialogue(ci,c){
  const D=window.Dialogue,f=fixes.get();
  const res=D.attributeChapter({paras:c.paras},dlg.cast,dlg.data.tails[ci]||null);
  return res.paras.map((segs,pi)=>{
    if(!segs.some(isLine))return `<p class="para">${esc(c.paras[pi])}</p>`;
    /* group into runs: one row per consecutive speaker; narration stays in order as small tags */
    const rows=[];let cur=null,pending=[],qi=0;
    for(const sg of segs){
      if(!isLine(sg)){
        const txt=sg.t==='n'?sg.text:sg.open+sg.text+sg.close;
        if(!txt.trim())continue;
        if(cur)cur.items.push({tag:txt});else pending.push({tag:txt});
        continue;
      }
      const key=ci+':'+pi+':'+qi;qi++;
      const manual=Object.prototype.hasOwnProperty.call(f.line,key);
      const raw=manual?(f.line[key]||null):sg.speaker;
      const id=resolveSpeaker(raw,f);
      const conf=manual?'manual':(id?sg.conf:null);
      if(!cur||cur.id!==id){
        /* narration between two different speakers belongs to the next one's lead-in */
        if(cur&&cur.id!==id){const t=[];while(cur.items.length&&cur.items[cur.items.length-1].tag!==undefined)t.unshift(cur.items.pop());pending=t.concat(pending)}
        cur={id,conf,key,items:pending.slice()};pending=[];rows.push(cur);
      }
      cur.items.push({q:sg.text,key,th:sg.t==='th'});
      if(conf==='inferred'&&cur.conf!=='inferred'&&cur.conf!=='manual')cur.conf=conf;
    }
    if(pending.length&&cur)cur.items.push(...pending);
    const html=rows.map(r=>{
      const ch=r.id?castById(r.id):null;
      const label=ch?esc(ch.name):'未知';
      const cf=r.conf==='inferred'?'<span class="cf">推测</span>':r.conf==='manual'?'<span class="cf">已修正</span>':'';
      /* adjacent narration pieces (split by an embedded “quoted term”) form one line */
      const items=[];for(const it of r.items){const last=items[items.length-1];if(it.tag!==undefined&&last&&last.tag!==undefined)last.tag+=it.tag;else items.push({...it})}
      const body=items.map(it=>it.q!==undefined?`<div class="dl-bub${it.th?' th':''}">${esc(it.q)}</div>`:`<span class="dl-tag">${esc(it.tag)}</span>`).join('');
      return `<div class="dl-row${ch?'':' unk'}${r.conf==='inferred'?' inf':''}"${ch?` style="--h:${ch.hue}"`:''}>
        <button class="av${ch?' p'+ch.pattern:''}" data-fix="${r.key}" aria-label="更改说话人：${label}">${ch?esc(ch.glyph):'?'}</button>
        <div class="dl-col"><button class="dl-who" data-fix="${r.key}">${label}${cf}</button>${body}</div></div>`;
    }).join('');
    return `<div class="para dlg">${html}</div>`;
  }).join('');
}

/* ---------- sheet: speaker picker & cast manager ---------- */

function closeSheet(){sheetState=null;$('#sheet').hidden=true;if(!$('#toc').classList.contains('open'))$('#shade').hidden=true}
function castRows(filter,f,opts={}){
  const q=(filter||'').trim();
  const list=dlg.cast.list.filter(c=>!f.merge[c.id]&&(opts.showHidden||!f.hide[c.id])&&(!q||c.name.includes(q)||(c.aliases||[]).some(a=>a.includes(q))));

function drawSheet(){

  }else{

      const merged=Object.keys(f.merge).filter(k=>f.merge[k]===c.id).map(k=>castById(k)).filter(Boolean).map(x=>x.name);
      const al=[...(c.aliases||[]),...merged];

        <span class="acts"><button class="btn" data-merge="${esc(c.id)}">合并到…</button><button class="btn" data-hide="${esc(c.id)}">${f.hide[c.id]?'恢复':'不是角色'}</button></span></div>`;

      ${st.mergeFrom?'<div class="quote">合并后，这本书里它的所有对话都算作所选角色，并使用所选角色的颜色和头像。</div>':`<div class="quote">按说话次数排列，共 ${dlg.cast.list.length} 个。颜色和头像由书本内容决定，所有章节、所有设备上都一致。</div>`}
      <input id="sheetSearch" placeholder="搜索角色…" value="${esc(search)}" autocomplete="off"></header>
      <div id="sheetList">${st.mergeFrom?castRows(search,f).filter(c=>c.id!==st.mergeFrom).map(c=>`<button class="pick" data-into="${esc(c.id)}">${avHTML(c)}<span class="nm">${esc(c.name)}</span><span class="meta">${c.lines} 句</span></button>`).join(''):rows}</div>
      <footer><span>${n?`已有 ${n} 处修正`:'还没有修正'}</span>${n&&!st.mergeFrom?'<button class="btn" id="sheetResetAll">清除全部修正</button>':''}</footer>`;
  }
  $('#sheetX').onclick=closeSheet;

  el.querySelectorAll('input[name=scope]').forEach(r=>r.onchange=()=>{st.scope=r.value});
  const reset=$('#sheetReset');if(reset)reset.onclick=()=>{const f2=fixes.get();delete f2.line[st.key];fixes.set(f2);closeSheet();rerender()};
  const ra=$('#sheetResetAll');if(ra)ra.onclick=()=>{fixes.set({line:{},merge:{},hide:{}});drawSheet();rerender()};
}

  const all=store.get('progress',{});
  let rec=all[id];
  /* migrate v1.0 records ("filename:size" + pixel offset) */
  const legacy=all[name+':'+buf.byteLength];
  if(!rec&&legacy&&typeof legacy.idx==='number'){rec={ch:legacy.idx,p:0,t:legacy.t||0};delete all[name+':'+buf.byteLength];all[id]=rec;store.set('progress',all)}
  buildToc();
  $('#pct').hidden=false;
  dlg.data=null;dlg.cast=null;
  render(rec?rec.ch:0,rec?rec.p:0);
  if(persist)saveBook(name,buf);
  if(S.dialogue)ensureDialogue();
  wake();
  onBookOpened(rec||null);
}
function openFile(f){if(!f)return;const r=new FileReader();r.onload=()=>openBuffer(f.name,r.result,true);r.readAsArrayBuffer(f)}

function showDrop(){
  saveProgress();book=null;paraEls=[];$('#progress').style.width=0;$('#pct').hidden=true;
  $('#main').innerHTML=`<div id="drop"><h1>TXT 小说阅读器</h1>
    <p>选择${isTouch?'':'或拖入 '}一本 .txt 小说，自动识别编码（UTF-8 / GBK）并按「第X章」「第X卷」分章。<br>书只保存在这台设备上，不会上传；阅读进度可通过 Google Drive 同步。</p>
    <label for="file">选择 TXT 文件</label><input type="file" id="file" accept=".txt,text/plain" hidden><div id="resume"></div></div>`;
  $('#file').onchange=e=>openFile(e.target.files[0]);
  $('#barTitle').textContent='TXT 小说阅读器';document.title='TXT 小说阅读器';
  loadBook().then(b=>{if(b&&b.buf&&$('#resume')){$('#resume').innerHTML=`<button class="btn" id="resBtn">继续阅读：${esc(b.name)}</button>`;$('#resBtn').onclick=()=>openBuffer(b.name,b.buf,false)}});
}
$('#openBtn').onclick=showDrop;
document.addEventListener('dragover',e=>{e.preventDefault();const d=$('#drop');if(d)d.classList.add('over')});
document.addEventListener('dragleave',()=>{const d=$('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{e.preventDefault();openFile(e.dataTransfer.files[0])});

document.addEventListener('keydown',e=>{
  if(!book||e.target.tagName==='INPUT'||sheetState)return;
  if(e.key==='ArrowRight')render(idx+1);
  else if(e.key==='ArrowLeft')render(idx-1);
  else if(e.key==='t'||e.key==='T')toggleToc(!$('#toc').classList.contains('open'));
  else if(e.key==='Escape')toggleToc(false);
});

/* ---------- Cross-device sync: Google Drive appDataFolder ----------
   Each book's position is one small JSON file named <bookId>.json in the
   app's hidden Drive folder (scope drive.appdata: the app can see only its
   own files, never the rest of your Drive). Only positions are uploaded,
   never book text. Sign-in uses the OAuth 2.0 redirect flow for
   client-side apps, which works inside an installed iOS/Android web app
   where popups don't. Tokens last ~1 hour; on launch an expired token is
   renewed silently with prompt=none. Last write wins; a newer remote
   position is offered, not forced. */
const CFG=window.READER_CONFIG||{};
const SCOPE='https://www.googleapis.com/auth/drive.appdata email';
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const DEV=(()=>{const u=navigator.userAgent;
  if(/iPad|Macintosh/.test(u)&&navigator.maxTouchPoints>1)return 'iPad';
  if(/iPhone/.test(u))return 'iPhone';if(/Android/.test(u))return 'Android';
  if(/Mac/.test(u))return 'Mac';if(/Windows/.test(u))return 'Windows';return isTouch?'手机':'电脑'})();
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const auth={
  get(){return store.get('gauth',null)},
  set(v){store.set('gauth',v)},
  valid(){const a=this.get();return !!(a&&a.on&&a.token&&a.exp>Date.now()+60000)},
};
function startAuth(silent){
  if(!CFG.googleClientId)return;
  if(book)saveProgress(true);
  const st=crypto.getRandomValues(new Uint32Array(4)).join('-');
  ss.set('nr_oauth_state',st);
  if(silent)ss.set('nr_silent_tried','1');
  const a=auth.get()||{};
  const q=new URLSearchParams({client_id:CFG.googleClientId,redirect_uri:REDIRECT,response_type:'token',
    scope:SCOPE,include_granted_scopes:'true',state:st});
  if(silent)q.set('prompt','none');
  if(a.email)q.set('login_hint',a.email);
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+q);
}
/* returns null (no redirect in URL), 'ok', or an OAuth error code */
function handleAuthRedirect(){
  if(!/[#&]state=/.test(location.hash))return null;
  const h=new URLSearchParams(location.hash.slice(1));
  history.replaceState(null,'',location.pathname+location.search);
  const expect=ss.get('nr_oauth_state');ss.del('nr_oauth_state');
  if(!expect||h.get('state')!==expect)return 'bad_state';
  if(h.get('error'))return h.get('error');
  if(!(h.get('scope')||'').includes('drive.appdata'))return 'scope_denied';
  const prev=auth.get()||{};
  auth.set({on:true,token:h.get('access_token'),exp:Date.now()+(+h.get('expires_in')||3600)*1000,email:prev.email||''});
  return 'ok';
}
async function gfetch(url,opt={}){
  if(!auth.valid())throw {code:'auth'};
  let r;
  try{r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+auth.get().token}})}
  catch(e){throw {code:'unavailable'}}                      /* offline / network */
  if(r.status===401){const a=auth.get();a.exp=0;auth.set(a);throw {code:'auth'}}
  if(r.status===429||r.status>=500||(r.status===403&&/rateLimit|userRateLimit/i.test(await r.clone().text())))throw {code:'unavailable'};
  if(!r.ok)throw {code:'http',status:r.status};
  return r;
}
const DRIVE='https://www.googleapis.com/drive/v3/files',UPLOAD='https://www.googleapis.com/upload/drive/v3/files';
const drive={
  ids:null,
  async list(){
    const r=await gfetch(DRIVE+'?spaces=appDataFolder&pageSize=1000&fields=files(id,name,modifiedTime)');
    const j=await r.json();const ids={},mt={};
    for(const f of j.files||[]){if(!ids[f.name]||f.modifiedTime>mt[f.name]){ids[f.name]=f.id;mt[f.name]=f.modifiedTime}}
    return this.ids=ids;
  },
  async get(bookId){
    const name=bookId+'.json';
    if(!this.ids||!this.ids[name])await this.list();
    const id=this.ids[name];if(!id)return null;
    try{return await (await gfetch(`${DRIVE}/${id}?alt=media`)).json()}
    catch(e){if(e.code==='http'&&e.status===404){this.ids=null;return null}throw e}
  },
  async put(bookId,body){
    const name=bookId+'.json';
    if(!this.ids)await this.list();
    const id=this.ids[name],json=JSON.stringify(body);
    if(id){
      try{await gfetch(`${UPLOAD}/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:json});return}
      catch(e){if(!(e.code==='http'&&e.status===404))throw e;delete this.ids[name]}
    }
    const b='nrb'+Date.now().toString(36);
    const meta=JSON.stringify({name,parents:['appDataFolder'],mimeType:'application/json'});
    const payload=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${b}--`;
    const r=await gfetch(UPLOAD+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:payload});
    this.ids[name]=(await r.json()).id;
  },
};
async function withRetry(fn){
  try{return await fn()}
  catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*1200));return fn()}throw e}
}

/* ---- sync state ---- */
const sync={on:false,checked:'',busy:false,again:false,timer:0,lastPushed:'',openRec:null};
/* books whose local position hasn't reached Drive yet (survives reloads and sign-in redirects) */
const dirty={get(){return store.get('dirty',{})},add(id){const d=this.get();d[id]=1;store.set('dirty',d)},del(id){const d=this.get();if(d[id]){delete d[id];store.set('dirty',d)}}};
const SYNC_UI={
  signedout:['连接同步','用 Google 账号在各设备间同步阅读进度'],
  renew:['重新连接','登录已过期，点击重新连接 Google 同步'],
  ok:['☁ 已同步','进度已保存到你的 Google Drive'],
  saving:['☁ 同步中…','正在保存进度'],
  err:['同步失败','暂时连不上 Google，稍后自动重试'],
};
function setSync(state){
  const el=$('#sync');sync.state=state;
  if(!state){el.hidden=true;return}
  el.hidden=false;el.dataset.s=state;el.textContent=SYNC_UI[state][0];el.title=SYNC_UI[state][1];
}
$('#sync').onclick=()=>{
  const st=sync.state;
  if(st==='signedout'||st==='renew'){startAuth(false);return}
  const a=auth.get()||{};
  toast(`已连接 Google 同步${a.email?'：'+esc(a.email):''}`,'断开',disconnect);
};
function disconnect(){
  const a=auth.get();
  if(a&&a.token)fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(a.token),{method:'POST'}).catch(()=>{});
  auth.set({on:false});sync.on=false;drive.ids=null;setSync('signedout');
}
const sigOf=(id,r)=>id+':'+r.ch+':'+r.p;

function onLocalProgress(rec,urgent){
  if(!book)return;
  dirty.add(book.id);
  clearTimeout(sync.timer);
  if(sync.on)sync.timer=setTimeout(flush,urgent?0:10000);
}
async function flush(){
  clearTimeout(sync.timer);
  if(!sync.on)return;
  if(sync.busy){sync.again=true;return}
  const all=store.get('progress',{});
  /* the open book waits until its remote copy has been checked */
  const ids=Object.keys(dirty.get()).filter(id=>all[id]&&!(book&&id===book.id&&sync.checked!==id));
  if(!ids.length)return;
  sync.busy=true;setSync('saving');
  try{
    for(const id of ids){
      const rec=all[id],isOpen=book&&id===book.id;
      if(isOpen&&sigOf(id,rec)===sync.lastPushed){dirty.del(id);continue}
      if(!isOpen){                      /* background book: don't clobber a newer remote */
        const r=await withRetry(()=>drive.get(id));
        if(r&&(r.t||0)>=(rec.t||0)){dirty.del(id);continue}
      }
      await withRetry(()=>drive.put(id,{ch:rec.ch,p:rec.p,pct:rec.pct,title:rec.title,name:rec.name,t:rec.t,dev:DEV}));
      if(isOpen)sync.lastPushed=sigOf(id,rec);
      if((store.get('progress',{})[id]||{}).t===rec.t)dirty.del(id);
    }
    setSync('ok');
  }catch(e){syncError(e)}
  finally{
    sync.busy=false;
    if(sync.again){sync.again=false;flush()}
  }
}
function syncError(e){
  if(e&&e.code==='auth'){sync.on=false;setSync('renew');return}
  setSync('err');clearTimeout(sync.timer);sync.timer=setTimeout(flush,30000);
}
/* compare the open book with Drive; `local` is this device's record from before opening */
async function checkRemote(local){
  if(!sync.on||!book)return;
  const id=book.id;let r;
  try{r=await withRetry(()=>drive.get(id))}catch(e){syncError(e);return}
  if(!book||book.id!==id)return;
  sync.checked=id;
  if(!r||typeof r.ch!=='number'||r.ch>=book.chapters.length){flush();return}
  sync.lastPushed=sigOf(id,r);
  const cur=curPos();
  if(r.ch===cur.ch&&Math.abs(r.p-cur.p)<=1){dirty.del(id);setSync('ok');return}
  if(local&&(local.t||0)>=(r.t||0)){flush();return}            /* this device is newer */
  const where=r.dev&&r.dev!==DEV?`在 ${esc(r.dev)} 上`:'在其他设备上';
  const label=`<b>${esc(r.title||'')}</b>（${fmtPct(typeof r.pct==='number'?r.pct:pctOf(r.ch,r.p||0))}）`;
  setSync('ok');
  if(!local){jumpTo(r);toast(`已同步${where}的进度：${label}`);return}
  sync.lastPushed=sigOf(id,cur);dirty.del(id);              /* keep Drive as-is until the reader moves */
  toast(`你${where}读到 ${label}`,'跳转',()=>jumpTo(r));
}
function jumpTo(r){if(book)sync.lastPushed=sigOf(book.id,{ch:r.ch,p:r.p||0});render(r.ch,r.p||0)}
function onBookOpened(rec){sync.openRec=rec;sync.checked='';hideToast();checkRemote(rec)}
function onResume(){
  if(!book)return;
  if(sync.on&&!auth.valid()){sync.on=false;setSync('renew');return}
  if(sync.on&&sync.checked===book.id)checkRemote(store.get('progress',{})[book.id]||null);
  else if(sync.on)flush();
}
window.addEventListener('online',()=>{if(sync.on)flush()});

let toastT=0;
function toast(html,act,fn){
  $('#toastMsg').innerHTML=html;
  const b=$('#toastAct');b.hidden=!act;
  if(act){b.textContent=act;b.onclick=()=>{fn();hideToast()}}
  $('#toast').hidden=false;clearTimeout(toastT);toastT=setTimeout(hideToast,act?15000:5000);
}
function hideToast(){$('#toast').hidden=true}
$('#toastX').onclick=hideToast;

async function initSync(){
  if(!CFG.googleClientId){setSync(null);return}           /* sync not configured: local-only reader */
  const res=handleAuthRedirect();
  if(res==='ok'){
    ss.del('nr_silent_tried');
    try{const u=await (await gfetch('https://www.googleapis.com/oauth2/v3/userinfo')).json();const a=auth.get();a.email=u.email||'';auth.set(a)}catch(e){}
  }else if(res==='access_denied'||res==='scope_denied'){
    auth.set({on:false});
    toast(res==='scope_denied'?'需要勾选「查看和管理此应用的配置数据」才能同步进度':'已取消 Google 登录，进度只保存在本机');
  }else if(res==='bad_state'){toast('登录校验失败，请重新连接')}
  const a=auth.get();
  if(!a||!a.on){setSync('signedout');return}
  if(!auth.valid()){
    if(!res&&!ss.get('nr_silent_tried')){startAuth(true);return}   /* quick silent bounce through Google */
    setSync('renew');return
  }
  sync.on=true;setSync('ok');
  if(book)checkRemote(sync.openRec);else flush();
}
initSync();

/* ---------- PWA: offline cache + open .txt files from the OS (desktop Chrome/Edge) ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if('launchQueue' in window){
  launchQueue.setConsumer(async p=>{if(p.files&&p.files.length){const f=await p.files[0].getFile();openFile(f)}});
}

showDrop();
loadBook().then(b=>{if(b&&b.buf)openBuffer(b.name,b.buf,false)});
</script>
